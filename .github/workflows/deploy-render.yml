name: Test and deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same branch supersedes an older run still in progress.
concurrency:
  group: render-rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Missing GitHub repository secret: RENDER_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          # Deploy the exact commit tested by this run.
          status=$(curl --silent --show-error --fail \
            --output /dev/null --write-out '%{http_code}' \
            --get --request POST \
            --data-urlencode "ref=$GITHUB_SHA" \
            "$RENDER_DEPLOY_HOOK_URL")
          if [[ "$status" != "200" && "$status" != "202" ]]; then
            echo "Render returned HTTP $status; deployment was not accepted." >&2
            exit 1
          fi
          echo "Render accepted the deployment request (HTTP $status)."
